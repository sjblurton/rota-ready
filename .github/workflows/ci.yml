name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be part-way through production migrations.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep shadcn components as CLI output
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'shadcn-upgrade')
        run: .github/scripts/check-shadcn-untouched.sh "origin/${{ github.base_ref }}"

      - uses: jdx/mise-action@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      - name: Keep new migrations atomic and safe for the running API
        if: github.event_name == 'pull_request'
        run: pnpm lint:migrations "origin/${{ github.base_ref }}"

      - run: pnpm typecheck

      - name: Start local Supabase (Postgres and Auth)
        run: pnpm exec supabase start -x studio

      - name: Export the local Supabase settings
        run: |
          status=$(pnpm exec supabase status -o env)
          read_var() { echo "$status" | sed -n "s/^$1=\"\(.*\)\"$/\1/p"; }
          db_url=$(read_var DB_URL)
          api_url=$(read_var API_URL)
          publishable_key=$(read_var PUBLISHABLE_KEY)
          if [ -z "$db_url" ] || [ -z "$api_url" ] || [ -z "$publishable_key" ]; then
            echo "::error::Could not read DB_URL, API_URL or PUBLISHABLE_KEY from supabase status"; exit 1
          fi
          {
            echo "DATABASE_URL=$db_url"
            echo "SUPABASE_URL=$api_url"
            echo "VITE_SUPABASE_URL=$api_url"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$publishable_key"
            echo "STAFF_LINK_KEY=$(openssl rand -base64 32)"
            echo "SMTP_URL=smtp://127.0.0.1:54325"
            echo "EMAIL_FROM=Rota Ready <rota@example.com>"
          } >> "$GITHUB_ENV"

      - name: Apply migrations to a fresh Supabase database
        run: pnpm db:migrate

      - run: pnpm test
        if: github.event_name != 'pull_request'

      - name: Run the tests with coverage
        if: github.event_name == 'pull_request'
        run: pnpm test:coverage

      - run: pnpm build

      - name: Install Playwright's Chromium
        run: pnpm --filter @rota-ready/web exec playwright install --with-deps chromium

      - name: Run the Playwright journey against the real stack
        run: pnpm --filter @rota-ready/web e2e
        env:
          E2E_SCREENSHOTS: ${{ github.workspace }}/journey-screenshots

      - name: Upload a screenshot of every journey step
        id: screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: journey-screenshots
          path: journey-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Write the CI report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: node .github/scripts/ci-report.mjs "origin/${{ github.base_ref }}" ci-report.md
        env:
          SCREENSHOTS_URL: ${{ steps.screenshots.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Hand the CI report to the job that posts it
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report.md
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  report:
    name: Post the CI report
    needs: check
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-report

      - name: Create the CI report comment, or update it in place
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f ci-report.md ]; then
            echo "::warning::The check job wrote no CI report"; exit 0
          fi
          body=$(jq -Rs '{body: .}' ci-report.md)
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ci-report -->"))) | .id')
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            echo "$body" | gh api -X PATCH "repos/$REPO/issues/comments/$id" --input - > /dev/null
          else
            echo "$body" | gh api "repos/$REPO/issues/$PR/comments" --input - > /dev/null
          fi

  deploy:
    name: Migrate and deploy to production
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rota-ready.onrender.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations to the production database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy the API and wait until it is live
        run: .github/scripts/render-deploy.sh "$DEPLOY_HOOK" "$SERVICE_ID"
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Deploy the web app and wait until it is live
        run: .github/scripts/render-deploy.sh "$DEPLOY_HOOK" "$SERVICE_ID"
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
          SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
