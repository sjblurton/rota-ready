name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Start local Supabase Postgres
        run: pnpm exec supabase db start

      - name: Export DATABASE_URL from the local stack
        run: |
          url=$(pnpm exec supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')
          if [ -z "$url" ]; then echo "::error::Could not read DB_URL from supabase status"; exit 1; fi
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Apply migrations to a fresh Supabase database
        run: pnpm db:migrate

      - run: pnpm test
      - run: pnpm build
